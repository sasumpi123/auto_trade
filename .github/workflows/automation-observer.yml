name: Development automation observer (read only)
on:
  issues:
    types: [opened, labeled, unlabeled, edited, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed, edited]
  # Trusted base workflow; never fetch or execute a PR head or its artifacts.
  pull_request_target:
    types: [opened, synchronize, edited, reopened, closed]
  workflow_run:
    workflows: [Python safety tests]
    types: [completed]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read
  # Metadata read is implicit. GITHUB_TOKEN cannot grant administration: read.
concurrency:
  group: automation-observer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.repository == 'sasumpi123/auto_trade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify GitHub state with no execution or writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_DOTENV_DISABLED: '1'
        run: python tools/automation_plan.py
