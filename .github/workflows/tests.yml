name: Python safety tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-safety-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHON_DOTENV_DISABLED: '1'
      ACC_KEY: ''
      SEC_KEY: ''
      APP_TOKEN: ''
      UPBIT_ACCESS_KEY: ''
      UPBIT_SECRET_KEY: ''
      SLACK_APP_TOKEN: ''
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirement.txt
      - name: Record interpreter and tested SHA
        run: |
          python --version
          git rev-parse HEAD
      - name: Check paper mode and sensitive files
        run: python tools/check_safety.py
      - name: Install dependencies
        run: python -m pip install -r requirement.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py config.py trading services data_analyzer utils tests tools
      - name: Run the entire offline test suite
        run: python -m unittest discover -v

  safety-gate:
    name: Python 3.12 safety gate
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all platforms to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
